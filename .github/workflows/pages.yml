name: Deploy docs (GitHub Pages)

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll (just-the-docs)
        run: >-
          bundle exec jekyll build
          --source ./docs
          --destination ./_site
          --baseurl "${{ steps.pages.outputs.base_path }}"
          --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Validate generated links and assets
        run: >-
          bundle exec htmlproofer ./_site
          --disable-external
          --swap-urls '^${{ steps.pages.outputs.base_path }}/:/'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
