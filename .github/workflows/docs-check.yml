name: Docs check

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/pages.yml"
      # Sources and outputs of the packaged AI documentation (tools/docs/sync-package-docs.py).
      - ".agents/skills/onity-use/**"
      - "tools/docs/**"
      - "Packages/com.onity.framework/Documentation~/**"
      - "Packages/com.onity.framework/README.md"
      - "Packages/com.onity.framework/AGENTS.md"
      - "Packages/com.onity.framework/CLAUDE.md"
      - "Packages/com.onity.framework/llms.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and validate docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll (strict front matter)
        run: >-
          bundle exec jekyll build
          --source ./docs
          --destination ./_site
          --baseurl /Onity
          --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Validate generated links and assets
        run: >-
          bundle exec htmlproofer ./_site
          --disable-external
          --swap-urls '^/Onity/:/'

  # The UPM package ships a generated copy of the guides and the onity-use skill under
  # Packages/com.onity.framework/Documentation~ (see tools/docs/sync-package-docs.py).
  # docs/ and .agents/skills/ stay the source of truth; this fails when the committed copy is stale.
  package-docs:
    name: Verify packaged docs are in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Documentation~ is up to date
        run: python tools/docs/sync-package-docs.py --check
