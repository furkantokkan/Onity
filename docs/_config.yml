title: Onity
description: "Unity-first framework for dependency injection, async tasks, reactive state, messaging, factories, and pooling."
url: "https://furkantokkan.github.io"
baseurl: "/Onity"
repository: "furkantokkan/Onity"
lang: "en-US"

# Built by the "Deploy docs (GitHub Pages)" Actions workflow with the just-the-docs gem.
theme: just-the-docs
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Apply the just-the-docs layout to every page so the theme chrome (header, sidebar,
# search, CSS) wraps all content. Without this, pages render as bare HTML.
defaults:
  - scope:
      path: ""
    values:
      layout: default

color_scheme: dark
search_enabled: true
heading_anchors: true

aux_links:
  "View on GitHub":
    - "https://github.com/furkantokkan/Onity"
  "v0.3.6 Release":
    - "https://github.com/furkantokkan/Onity/releases/tag/v0.3.6"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"
footer_content: "Onity is an open-source Unity framework distributed under the <a href=\"https://github.com/furkantokkan/Onity/blob/main/LICENSE\">MIT License</a>."

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/furkantokkan/Onity"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

# Internal planning notes and the GitBook table of contents are not part of the site.
exclude:
  - "Plan/"
  - "SUMMARY.md"
